<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ARA Systems × FZ Creative Solutions: Proposta Comercial</title>
<meta name="description" content="Proposta comercial da ARA Systems para a FZ Creative Solutions: landing page, site institucional, KoruVision CRM, criação de conteúdo, gestão de redes e Google Ads.">
<meta name="theme-color" content="#0b0618">
<link rel="icon" href="imagens/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="imagens/icone.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ARA × FZ">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0618;
  --ink:#0f0820;
  --ink-2:#160a28;
  --gold:#ff7a1a;
  --gold-soft:#ff9a4a;
  --gold-dim:rgba(255,122,26,.28);
  --nude:#ead8f4;
  --text:#f4eef8;
  --muted:#b8a8c9;
  --line:rgba(232,212,240,.14);
  --serif:'Syne','Segoe UI',system-ui,sans-serif;
  --sans:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#05030c;overflow:hidden;font-family:var(--sans);color:var(--text);-webkit-font-smoothing:antialiased}

.stage{position:fixed;inset:0;display:flex;align-items:stretch;justify-content:stretch;background:var(--ink)}
.deck{position:relative;width:100%;height:100%;height:100dvh;transform-origin:center center;flex:none}

.slide{position:absolute;inset:0;display:none;background:var(--ink);overflow:hidden;border-radius:0}
.slide.on{display:flex;flex-direction:column}
.pad{position:relative;inset:auto;padding:calc(26px + env(safe-area-inset-top)) 20px 88px;display:flex;flex-direction:column;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.fit{display:flex;flex-direction:column;flex:0 0 auto;min-height:0;transform-origin:top left}
.pad.decl>.fit{justify-content:flex-start}

.grain{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:3px 3px}
.glow{position:absolute;width:420px;height:420px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,122,26,.16) 0%,transparent 62%);filter:blur(10px)}
.glow.tl{top:-380px;left:-260px}
.glow.br{bottom:-420px;right:-300px;background:radial-gradient(circle,rgba(124,58,237,.28) 0%,transparent 62%)}

.kicker{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.kicker::after{content:'';height:1px;width:28px;background:linear-gradient(90deg,var(--gold),transparent)}

h1{font-family:var(--serif);font-weight:700;font-size:34px;line-height:1.08;letter-spacing:-.03em}
h2{font-family:var(--serif);font-weight:700;font-size:27px;line-height:1.14;letter-spacing:-.025em;margin-bottom:12px}
h3{font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.2}
.sub{font-size:15px;line-height:1.55;color:var(--muted);font-weight:300;max-width:none;margin-bottom:22px}
em.g{font-style:normal;color:var(--gold-soft)}
strong{font-weight:600;color:#fff}

.rule{height:1px;background:linear-gradient(90deg,var(--gold),var(--gold-dim) 30%,transparent);margin:0 0 30px}

/* ---------- capa ---------- */
.capa{position:relative;inset:auto;flex:1;min-height:0;display:flex}
.capa .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.capa .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,6,24,.55) 0%,rgba(11,6,24,.9) 45%,rgba(11,6,24,.98) 100%)}
.capa .in{position:relative;inset:auto;flex:1;min-height:0;max-width:none;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(26px + env(safe-area-inset-top)) 20px 96px;display:flex;flex-direction:column;justify-content:flex-end}
.capa h1{font-size:38px;margin:8px 0 18px;font-weight:700;letter-spacing:-.035em}
.capa .marca{font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--nude);font-weight:400}
.capa .meta{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);display:flex;gap:20px;flex-wrap:wrap;font-size:12px;color:var(--muted);letter-spacing:.06em}
.capa .meta b{display:block;color:var(--gold-soft);font-weight:500;font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px}

/* ---------- divisor de secao ---------- */
.secao{position:relative;inset:auto;flex:1;min-height:0;display:flex}
.secao .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.secao .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,6,24,.6),rgba(11,6,24,.95) 60%)}
.secao .in{position:relative;inset:auto;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(26px + env(safe-area-inset-top)) 20px 88px;display:flex;flex-direction:column;justify-content:center}
.secao .ico.lg{margin:0}
.secao-top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.secao .num{font-family:var(--serif);font-size:36px;line-height:1;color:transparent;-webkit-text-stroke:1px var(--gold-dim);margin:0}
.secao h1{font-size:40px;max-width:none;letter-spacing:-.03em}
.secao .sub{margin-top:14px;font-size:16px;max-width:none;color:var(--nude);opacity:.82}

/* ---------- declaracao ---------- */
.bgfoto{position:absolute;inset:0;background-size:cover;background-position:center right}
.bgveil{position:absolute;inset:0;background:linear-gradient(95deg,rgba(15,8,32,.98) 34%,rgba(15,8,32,.82) 62%,rgba(15,8,32,.5) 100%)}
.decl{justify-content:center}
.decl.comfoto .frase,.decl.comfoto .nota,.decl.comfoto ul{max-width:730px}
.decl .frase{font-family:var(--serif);font-weight:600;font-size:27px;line-height:1.22;max-width:none;letter-spacing:-.025em}
.decl .frase p{margin-bottom:14px}
.decl .frase p:last-child{margin-bottom:0}
.decl .nota{margin-top:24px;padding-left:16px;border-left:2px solid var(--gold);font-size:15px;line-height:1.55;color:var(--nude);max-width:none;font-weight:300}
.decl ul{list-style:none;margin:20px 0 0}
.decl ul li{font-family:var(--sans);font-size:15px;font-weight:300;line-height:1.5;color:var(--muted);padding:9px 0;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid rgba(232,212,240,.07)}
.decl.comfoto .frase,.decl.comfoto .nota,.decl.comfoto ul{max-width:none}
.bgveil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,8,32,.72),rgba(15,8,32,.97) 55%)}

/* ---------- mosaico de cards ---------- */
.mosaico{display:grid;grid-template-columns:1fr;gap:10px;flex:1;align-content:start}
.mosaico.n4,.mosaico.n5,.mosaico.n6{grid-template-columns:1fr 1fr}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px 14px 18px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(165deg,rgba(255,255,255,.05),rgba(124,58,237,.07));min-height:0;transition:transform .25s ease,border-color .25s,box-shadow .25s,background .25s}
.tile .ico{width:36px;height:36px;border-radius:10px;margin-bottom:2px}
.tile .ico svg{width:16px;height:16px}
.tile h4{font-family:var(--serif);font-size:15px;font-weight:600;color:#fff;line-height:1.25}
.tile p{font-size:12px;line-height:1.4;font-weight:300;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;max-width:none}
.pill{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border:1px solid var(--line);border-radius:999px;font-size:11.5px;color:var(--nude);background:rgba(255,255,255,.03);letter-spacing:.02em;transition:transform .25s ease,border-color .25s,background .25s,box-shadow .25s}
.ico{display:inline-flex;align-items:center;justify-content:center;flex:none;width:38px;height:38px;border-radius:11px;color:var(--gold);background:linear-gradient(165deg,rgba(255,122,26,.16),rgba(124,58,237,.08));border:1px solid var(--gold-dim);transition:transform .25s ease,border-color .25s,box-shadow .25s,background .25s}
.ico svg{width:18px;height:18px;display:block}
.ico.lg{width:52px;height:52px;border-radius:16px}
.ico.lg svg{width:26px;height:26px}
.ico.sm{width:28px;height:28px;border-radius:8px}
.ico.sm svg{width:14px;height:14px}
.ico.neg{color:#e0a8a0;background:rgba(180,80,80,.12);border-color:rgba(180,120,120,.28)}
.ico.ok{color:#9ee0b8;background:rgba(70,170,120,.12);border-color:rgba(90,180,130,.28)}

/* ---------- duas colunas ---------- */
.duo,.cen,.pacs,.tl,.obj .grade{display:grid;grid-template-columns:1fr;gap:14px;flex:1;align-content:start}
.painel{border:1px solid var(--line);border-radius:10px;padding:20px 18px;background:linear-gradient(160deg,rgba(255,255,255,.035),rgba(255,255,255,.008));transition:transform .25s ease,border-color .25s,box-shadow .25s}
.painel.neg{border-color:rgba(180,120,120,.22)}
.painel.pos{border-color:var(--gold-dim);background:linear-gradient(160deg,rgba(255,122,26,.09),rgba(255,122,26,.015))}
.painel h4{font-family:var(--serif);font-size:21px;font-weight:400;margin-bottom:13px;padding-bottom:10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.painel.neg h4{color:#d9a9a2}
.painel.pos h4{color:var(--gold-soft)}
.painel ul{list-style:none}
.painel li{font-size:14px;line-height:1.5;font-weight:300;color:var(--nude);padding:6px 0;display:flex;align-items:flex-start;gap:10px}
.painel li::before{display:none}
.painel li b{color:#fff;font-weight:600}

/* ---------- cenario antes/depois ---------- */
.cen{align-content:center}
.cen .box{border-radius:10px;padding:20px 18px;border:1px solid var(--line);background:rgba(255,255,255,.02);display:flex;flex-direction:column;transition:transform .25s ease,border-color .25s,box-shadow .25s}
.cen .box.hi{border-color:var(--gold-dim);background:linear-gradient(165deg,rgba(255,122,26,.1),rgba(255,122,26,.02))}
.cen .tag{font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.cen .box.hi .tag{color:var(--gold)}
.cen .fala{font-family:var(--serif);font-size:27px;line-height:1.34;color:var(--nude);margin-bottom:20px}
.cen .box.hi .fala{color:#fff}
.cen ul{list-style:none;margin-top:auto}
.cen li{font-size:16px;line-height:1.5;font-weight:300;color:var(--muted);padding:7px 0 7px 19px;position:relative}
.cen li::before{content:'';position:absolute;left:0;top:14px;width:8px;height:1px;background:var(--gold-dim)}
.cen .box.hi li{color:var(--nude)}
.cen .selo{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:15px;color:var(--gold-soft);letter-spacing:.04em}

/* ---------- comparativo ---------- */
.tab,.tab tbody,.tab tr,.tab td,.tab th{display:block;width:100%}
.tab thead{display:none}
.tab th{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:0 12px 10px;border-bottom:1px solid var(--line)}
.tab td{font-size:13px;line-height:1.4;padding:10px 12px;border-bottom:none;color:var(--muted);vertical-align:top}
.tab td.b{color:#fff;font-weight:400;background:linear-gradient(90deg,rgba(255,122,26,.075),rgba(255,122,26,.02));border-radius:10px;margin-bottom:12px}
.tab tr{padding:4px 0 10px;border-bottom:1px solid rgba(232,212,240,.07);transition:background .25s}
.tab td .row{display:flex;align-items:center;gap:10px}
.tab th .row{display:flex;align-items:center;gap:8px}

/* ---------- ciclo ---------- */
.ciclo{display:flex;flex-direction:column;gap:2px;flex:1;align-items:stretch}
.ciclo .et{display:grid;grid-template-columns:42px 1fr;column-gap:14px;align-items:start;text-align:left;padding:9px 0;border-radius:12px;transition:transform .25s ease,background .25s}
.ciclo .n{width:42px;height:42px;margin:0;border-radius:12px;border:1px solid var(--gold-dim);display:flex;align-items:center;justify-content:center;color:var(--gold);background:linear-gradient(165deg,rgba(255,122,26,.18),rgba(124,58,237,.1));grid-row:1/span 2;transition:transform .25s ease,border-color .25s,box-shadow .25s}
.ciclo .n .ico{width:auto;height:auto;background:none;border:none;padding:0;color:var(--gold)}
.ciclo .n .ico svg{width:24px;height:24px}
.kicker .ico{width:22px;height:22px;border-radius:6px}
.kicker .ico svg{width:12px;height:12px}
.ciclo .t{font-family:var(--serif);font-size:18px;margin-bottom:3px;color:#fff;grid-column:2}
.ciclo .d{font-size:13.5px;line-height:1.45;color:var(--muted);font-weight:300;grid-column:2}
.ciclo .seta{display:none}

/* ---------- pacotes ---------- */
.pacs{grid-auto-flow:row;align-content:stretch}
.pac{border:1px solid var(--line);border-radius:12px;padding:20px 18px;display:flex;flex-direction:column;background:linear-gradient(170deg,rgba(255,255,255,.035),rgba(255,255,255,.006));transition:transform .25s ease,border-color .25s,box-shadow .25s}
.pac.dest{border-color:var(--gold);background:linear-gradient(170deg,rgba(255,122,26,.13),rgba(255,122,26,.02));box-shadow:0 0 44px rgba(255,122,26,.1)}
.pac .fx{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);height:16px;margin-bottom:8px}
.pac .ico{margin-bottom:12px}
.pac h4{font-family:var(--serif);font-size:25px;font-weight:700;margin-bottom:4px}
.pac .lin{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.pac ul{list-style:none;flex:1}
.pac li{font-size:14px;line-height:1.4;font-weight:300;color:var(--nude);padding:6px 0 6px 17px;position:relative}
.pac li::before{content:'+';position:absolute;left:0;top:6px;color:var(--gold);font-size:14px}
.pac .val{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);display:flex;flex-direction:row;flex-wrap:wrap;gap:18px 32px}
.pac .fx:empty{display:none}
.pac .val .l{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.pac .val .v{font-family:var(--serif);font-size:24px;color:var(--gold-soft);line-height:1.2}
.pac .val .g.ok .l,.pac .val .g.ok .v,.pac .val .g.ok .v span{color:#7dcea0}

/* ---------- timeline ---------- */
.tl{display:grid;grid-template-columns:repeat(4,1fr);gap:0;flex:1;align-content:center}
.tl .f{padding:0 26px 0 0;position:relative}
.tl .f::before{content:'';position:absolute;left:0;top:32px;right:0;height:1px;background:var(--gold-dim)}
.tl .f:last-child::before{background:linear-gradient(90deg,var(--gold-dim),transparent)}
.tl .b{width:14px;height:14px;border-radius:50%;background:var(--ink);border:1px solid var(--gold);position:relative;top:26px;box-shadow:0 0 0 5px var(--ink),0 0 16px rgba(255,122,26,.5)}
.tl .m{margin-top:52px;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:11px}
.tl .t{font-family:var(--serif);font-size:29px;margin-bottom:11px;line-height:1.15}
.tl .d{font-size:15.5px;line-height:1.5;color:var(--muted);font-weight:300;padding-right:14px}

/* ---------- preco ---------- */
.prec{display:flex;flex-direction:column;flex:1;justify-content:flex-start}
.prec .linhas{display:flex;flex-direction:column;gap:11px}
.prec .l{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(120deg,rgba(255,255,255,.035),transparent);transition:transform .25s ease,border-color .25s,box-shadow .25s}
.prec .l .nome{font-family:var(--serif);font-size:20px;margin-bottom:6px}
.prec .l .desc{font-size:13.5px;line-height:1.5;color:var(--muted);font-weight:300}
.prec .l .dir{flex:none;text-align:left;min-width:0;display:flex;align-items:baseline;gap:12px}
.prec .l .v{font-family:var(--serif);font-size:26px;color:var(--gold-soft);line-height:1.1}
.prec .l .cond{font-size:12.5px;color:var(--muted);margin-top:0;letter-spacing:.04em;font-weight:500}
.prec .l .cond.ok,.prec .l .cond.ok span{color:#7dcea0}
.prec .l.ok:not(.hi) .v,.prec .l.ok:not(.hi) .v span{color:#7dcea0}
.prec .l.inc{padding:12px 16px;gap:8px}
.prec .l.inc .nome{font-size:16px;margin-bottom:4px}
.prec .l.inc .desc{font-size:12.5px}
.prec .l.inc .v{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#7dcea0}
.prec .obs{margin-top:18px;padding:14px 16px;border-left:2px solid var(--gold);background:rgba(255,122,26,.06);font-size:14px;line-height:1.55;color:var(--nude);font-weight:300}
.prec .obs ul{list-style:none;margin:0;display:flex;flex-direction:column;gap:7px}
.prec .obs li{padding-left:16px;position:relative}
.prec .obs li::before{content:'';position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(255,122,26,.16)}
.prec .l.hi{border-color:var(--gold-dim);background:linear-gradient(120deg,rgba(255,122,26,.1),transparent)}
.prec .l .esq{flex:1}
.prec .obs b{color:#fff}
.vazio{color:var(--gold);border-bottom:1px dashed var(--gold-dim);padding-bottom:1px}

/* ---------- contato ---------- */
.fim{position:relative;inset:auto;flex:1;min-height:0;display:flex}
.fim .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.fim .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,6,24,.6),rgba(11,6,24,.96) 55%)}
.fim .in{position:relative;inset:auto;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(26px + env(safe-area-inset-top)) 20px 88px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left}
.fim .passos{list-style:none;margin:18px 0 26px;max-width:none;width:100%}
.fim .passos li{font-size:14.5px;line-height:1.5;font-weight:300;color:var(--nude);padding:9px 0;border-bottom:1px solid rgba(232,212,240,.08);display:flex;gap:14px;justify-content:flex-start;align-items:center;transition:transform .25s ease,background .25s}
.fim .kicker{justify-content:flex-start!important}
.fim h2{font-size:30px!important}
.fim .passos .n{color:var(--gold);font-family:var(--serif);font-size:19px;min-width:22px}
.fim .card{border:1px solid var(--gold-dim);border-radius:4px;padding:24px 34px;background:rgba(255,122,26,.06);text-align:right}
.fim .card .m{font-size:14px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:12px}
.fim .card .c{font-size:16px;color:var(--nude);line-height:1.8;font-weight:300}

/* ---------- rodape / hud ---------- */
.rod{display:none}
.barra{position:absolute;left:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));transition:width .45s ease;z-index:5}

.hud{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:40;opacity:1}
.hud::before{content:'';position:absolute;left:-60px;right:-60px;top:-26px;bottom:-40px;z-index:-1;pointer-events:none;background:linear-gradient(transparent,rgba(15,8,32,.9) 60%)}
.hud button{background:rgba(20,16,23,.9);border:1px solid var(--line);color:var(--nude);width:48px;height:48px;border-radius:50%;cursor:pointer;font-size:17px;transition:transform .25s ease,border-color .25s,color .25s,box-shadow .25s;backdrop-filter:blur(8px)}
.hud .conta{width:auto;padding:0 14px;border-radius:19px;font-size:12px;letter-spacing:.1em;cursor:default}

.zonas{display:none}

/* ---------- indice ---------- */
.menu{position:fixed;inset:0;background:rgba(8,4,18,.96);z-index:60;display:none;padding:26px 18px calc(26px + env(safe-area-inset-bottom));overflow:auto;backdrop-filter:blur(6px)}
.menu.on{display:block}
.menu h3{color:var(--gold);font-size:12px;letter-spacing:.3em;text-transform:uppercase;font-family:var(--sans);font-weight:500;margin-bottom:18px}
.menu .grade{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu .it{border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:transform .25s ease,border-color .25s,background .25s,box-shadow .25s;background:rgba(255,255,255,.02)}

/* ============================ RENDERIZACAO ============================ */

function rodape(s, i, total){
  return '<div class="rod"><span class="bloco">' + (s.bloco || AGENCIA) + '</span>' +
         '<span>' + AGENCIA + ' &nbsp;·&nbsp; ' + CLIENTE + '</span>' +
         '<span>' + String(i + 1).padStart(2, '0') + ' / ' + String(total).padStart(2, '0') + '</span></div>';
}
function cabeca(s){
  let h = '';
  if (s.kicker) h += '<div class="kicker">' + (s.ico ? ico(s.ico, 'sm') : '') + s.kicker + '</div>';
  if (s.titulo) h += '<h2>' + tx(s.titulo) + '</h2>';
  if (s.sub) h += '<p class="sub">' + tx(s.sub) + '</p>';
  else if (s.titulo) h += '<div class="rule"></div>';
  return h;
}
function pad(inner, cls){
  return '<div class="pad' + (cls ? ' ' + cls : '') + '"><div class="fit">' + inner + '</div></div>';
}
function listaItens(itens){
  const n = itens.length;
  return '<div class="mosaico n' + n + '">' + itens.map(it => {
    const t = Array.isArray(it) ? it[0] : it;
    const d = Array.isArray(it) ? it[1] : '';
    const ic = Array.isArray(it) ? it[2] : '';
    return '<article class="tile">' + (ic ? ico(ic) : '') +
      '<h4>' + tx(t) + '</h4>' +
      (d ? '<p>' + tx(d) + '</p>' : '') +
      '</article>';
  }).join('') + '</div>';
}
function itemIco(x, tom){
  if (Array.isArray(x)) return ico(x[1], tom === 'neg' ? 'sm neg' : 'sm') + '<span>' + tx(x[0]) + '</span>';
  return tx(x);
}

function render(s, i, total){
  const fundo = '<div class="glow tl"></div><div class="glow br"></div><div class="grain"></div>';
  let corpo = '';

  switch (s.tipo) {

  case 'capa':
    corpo = '<div class="capa">' +
      '<div class="bg" style="background-image:url(' + IMG(s.img) + ')"></div><div class="veil"></div>' + fundo +
      '<div class="in"><div class="marca">' + s.marca + '</div>' +
      '<h1>' + tx(s.titulo) + '</h1>' +
      (s.pills ? '<div class="pills">' + s.pills.map(p => '<span class="pill">' + ico(p[0], 'sm') + p[1] + '</span>').join('') + '</div>'
        : '<p class="sub" style="font-size:21px;color:var(--nude);opacity:.8;margin:0">' + tx(s.sub) + '</p>') +
      '<div class="meta">' + s.meta.map(m => '<div><b>' + m[0] + '</b>' + tx(m[1]) + '</div>').join('') + '</div></div></div>';
    break;

  case 'secao':
    corpo = '<div class="secao">' +
      '<div class="bg" style="background-image:url(' + IMG(s.img) + ')"></div><div class="veil"></div>' + fundo +
      '<div class="in"><div class="secao-top">' + (s.ico ? ico(s.ico, 'lg') : '') + '<div class="num">' + s.num + '</div></div><h1>' + tx(s.titulo) + '</h1>' +
      '<p class="sub">' + tx(s.sub) + '</p></div></div>' + rodape(s, i, total);
    break;

  case 'declaracao': {
    let h = '';
    if (s.kicker) h += '<div class="kicker">' + (s.ico ? ico(s.ico, 'sm') : '') + s.kicker + '</div>';
    else if (s.ico) h += '<div style="margin-bottom:22px">' + ico(s.ico, 'lg') + '</div>';
    h += '<div class="frase">' + s.frase.map(f => '<p>' + tx(f) + '</p>').join('') + '</div>';
    if (s.lista) h += '<ul>' + s.lista.map(l => {
      const t = Array.isArray(l) ? l[0] : l;
      const ic = Array.isArray(l) ? l[1] : '';
      return '<li>' + (ic ? ico(ic, 'sm') : '') + '<span>' + tx(t) + '</span></li>';
    }).join('') + '</ul>';
    if (s.nota) h += '<div class="nota">' + tx(s.nota) + '</div>';
    if (s.fecho) h += '<div style="margin-top:26px;font-family:var(--serif);font-size:24px;font-weight:600;color:var(--gold-soft);line-height:1.3">' + tx(s.fecho) + '</div>';
    const foto = s.img
      ? '<div class="bgfoto" style="background-image:url(' + IMG(s.img) + ')"></div><div class="bgveil"></div>'
      : '';
    corpo = foto + fundo + pad(h, 'decl' + (s.img ? ' comfoto' : '')) + rodape(s, i, total);
    break;
  }

  case 'lista': {
    let h = cabeca(s) + listaItens(s.itens);
    if (s.nota) h += '<div style="margin-top:20px;padding-left:22px;border-left:2px solid var(--gold);font-size:17px;line-height:1.55;color:var(--nude);font-weight:300">' + tx(s.nota) + '</div>';
    corpo = fundo + pad(h) + rodape(s, i, total);
    break;
  }

  case 'duo': {
    const col = c => '<div class="painel ' + c.tom + '"><h4>' + (c.ico ? ico(c.ico, c.tom === 'neg' ? 'sm neg' : 'sm') : '') + tx(c.titulo) + '</h4><ul>' +
      c.itens.map(x => '<li>' + itemIco(x, c.tom) + '</li>').join('') + '</ul></div>';
    let h = cabeca(s) + '<div class="duo">' + col(s.colA) + col(s.colB) + '</div>';
    if (s.nota) h += '<div style="margin-top:22px;padding-left:22px;border-left:2px solid var(--gold);font-size:18px;color:var(--nude);font-weight:300">' + tx(s.nota) + '</div>';
    corpo = fundo + pad(h) + rodape(s, i, total);
    break;
  }

  case 'cenario': {
    const box = (b, hi) => '<div class="box' + (hi ? ' hi' : '') + '"><div class="tag">' + b.tag + '</div>' +
      '<div class="fala">' + tx(b.fala) + '</div><ul>' + b.itens.map(x => '<li>' + tx(x) + '</li>').join('') + '</ul>' +
      '<div class="selo">' + tx(b.selo) + '</div></div>';
    corpo = fundo + pad(cabeca(s) + '<div class="cen">' + box(s.antes, false) + box(s.depois, true) + '</div>') +
      rodape(s, i, total);
    break;
  }

  case 'comparativo': {
    const linhas = s.linhas.map(l => '<tr><td><div class="row">' + ico(l[2] || 'x', 'sm neg') + '<span>' + tx(l[0]) + '</span></div></td><td class="b"><div class="row">' + ico(l[2] || 'check', 'sm ok') + '<span>' + tx(l[1]) + '</span></div></td></tr>').join('');
    corpo = fundo + pad(cabeca(s) +
      '<table class="tab"><thead><tr><th><div class="row">' + ico('x', 'sm neg') + s.cabA + '</div></th><th class="b"><div class="row">' + ico('check', 'sm ok') + s.cabB + '</div></th></tr></thead>' +
      '<tbody>' + linhas + '</tbody></table>') + rodape(s, i, total);
    break;
  }

  case 'ciclo': {
    const et = s.passos.map((x, k) => '<div class="et"><div class="n">' + (x[2] ? ico(x[2]) : (k + 1)) + '</div>' +
      '<div class="t">' + tx(x[0]) + '</div><div class="d">' + tx(x[1]) + '</div></div>').join('<div class="seta">&#8594;</div>');
    let h = cabeca(s) + '<div class="ciclo">' + et + '</div>';
    if (s.nota) h += '<div style="margin-top:10px;padding-left:22px;border-left:2px solid var(--gold);font-size:18px;color:var(--nude);font-weight:300">' + tx(s.nota) + '</div>';
    corpo = fundo + pad(h) + rodape(s, i, total);
    break;
  }

  case 'pacotes': {
    const cards = s.cards.map(c => '<div class="pac' + (c.dest ? ' dest' : '') + '">' +
      '<div class="fx">' + (c.fx || '') + '</div>' + (c.ico ? ico(c.ico) : '') + '<h4>' + tx(c.nome) + '</h4><div class="lin">' + tx(c.linha) + '</div>' +
      '<ul>' + c.itens.map(x => '<li>' + tx(x) + '</li>').join('') + '</ul>' +
      '<div class="val"><div class="g"><div class="l">' + (c.l1 || 'Entrada') + '</div><div class="v">' + tx(c.entrada) + '</div></div>' +
      (c.mensal ? '<div class="g"><div class="l">' + (c.l2 || 'Mensal') + '</div><div class="v">' + tx(c.mensal) + '</div></div>' : '') +
      (c.mensal6 ? '<div class="g ok"><div class="l">' + (c.l3 || '6 meses') + '</div><div class="v">' + tx(c.mensal6) + '</div></div>' : '') +
      '</div></div>').join('');
    let h = cabeca(s) + '<div class="pacs">' + cards + '</div>';
    if (s.nota) h += '<div style="margin-top:18px;font-size:15.5px;line-height:1.5;color:var(--muted);font-weight:300">' + tx(s.nota) + '</div>';
    corpo = fundo + pad(h) + rodape(s, i, total);
    break;
  }

  case 'timeline': {
    const f = s.fases.map(x => '<div class="f"><div class="b"></div><div class="m">' + x[0] + '</div>' +
      '<div class="t">' + x[1] + '</div><div class="d">' + tx(x[2]) + '</div></div>').join('');
    corpo = fundo + pad(cabeca(s) + '<div class="tl">' + f + '</div>') + rodape(s, i, total);
    break;
  }

  case 'preco': {
    const linhas = s.linhas.map(l => {
      const inc = !!l.incluso;
      return '<div class="l' + (l.hi ? ' hi' : '') + (inc ? ' inc' : '') + (l.ok && !inc ? ' ok' : '') + '">' +
        (l.ico ? ico(l.ico) : '') +
        '<div class="esq"><div class="nome">' + tx(l.nome) + '</div>' +
        (l.desc ? '<div class="desc">' + tx(l.desc) + '</div>' : '') + '</div>' +
        '<div class="dir"><div class="v">' + tx(l.valor) + '</div>' +
        (l.cond ? '<div class="cond' + (l.ok || inc ? ' ok' : '') + '">' + tx(l.cond) + '</div>' : '') +
        '</div></div>';
    }).join('');
    corpo = fundo + pad(cabeca(s) + '<div class="prec"><div class="linhas">' + linhas + '</div>' +
      (s.obs ? '<div class="obs">' + (Array.isArray(s.obs)
        ? '<ul>' + s.obs.map(x => '<li>' + tx(x) + '</li>').join('') + '</ul>'
        : tx(s.obs)) + '</div>' : '') + '</div>') + rodape(s, i, total);
    break;
  }

  case 'contato':
    corpo = '<div class="fim"><div class="bg" style="background-image:url(' + IMG(s.img) + ')"></div><div class="veil"></div>' + fundo +
      '<div class="in"><div class="kicker" style="justify-content:flex-end">' + (s.ico ? ico(s.ico, 'sm') : '') + s.kicker + '</div>' +
      '<h2 style="font-size:52px">' + tx(s.titulo) + '</h2>' +
      '<ol class="passos">' + s.passos.map((x, k) => {
        const t = Array.isArray(x) ? x[0] : x;
        const ic = Array.isArray(x) ? x[1] : '';
        return '<li>' + (ic ? ico(ic, 'sm') : '<span class="n">' + (k + 1) + '</span>') + '<span>' + tx(t) + '</span></li>';
      }).join('') + '</ol>' +
      '<div style="font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)">' + tx(s.validade) + '</div>' +
      '</div></div>';
    break;
  }

  return '<section class="slide" data-i="' + i + '">' + corpo + '<div class="barra" style="width:' +
    ((i + 1) / total * 100) + '%"></div></section>';
}

/* ============================== MOTOR ============================== */
const deck = document.getElementById('deck');
const total = SLIDES.length;
deck.innerHTML = SLIDES.map((s, i) => render(s, i, total)).join('');
const slides = Array.from(deck.querySelectorAll('.slide'));
let atual = 0;

function ir(n){
  atual = Math.max(0, Math.min(total - 1, n));
  slides.forEach((el, i) => el.classList.toggle('on', i === atual));
  document.getElementById('bConta').textContent = (atual + 1) + ' / ' + total;
  location.hash = atual + 1;
  slides[atual].querySelectorAll('.pad, .in').forEach(el => el.scrollTop = 0);
  animar(slides[atual]);
}
function animar(el){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const sel = '.kicker,h1,h2,.sub,.marca,.pill,.tile,.painel,.pac,.prec .l,.ciclo .et,.decl .frase,.decl ul li,.decl .nota,.tab tbody tr,.meta > div,.passos li,.secao-top,.obs,.obs li,.ico.lg';
  el.querySelectorAll(sel).forEach((n, i) => {
    n.style.animation = 'none';
    void n.offsetWidth;
    n.style.animation = 'enterY .55s cubic-bezier(.22,.61,.36,1) ' + (i * 0.045) + 's both';
  });
}
const prox = () => ir(atual + 1);
const ant  = () => ir(atual - 1);

/* No celular o deck ocupa a tela inteira e cada slide rola; o palco fixo de
   1280x720 e a reducao automatica de texto valem so a partir de 861px. */
const telaPequena = () => window.matchMedia('(max-width:860px)').matches;

function escala(){
  if (telaPequena()) { deck.style.transform = ''; return; }
  const m = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  deck.style.transform = 'scale(' + m + ')';
}
window.addEventListener('resize', () => { escala(); ajustar(); });
window.addEventListener('orientationchange', () => setTimeout(() => { escala(); ajustar(); }, 250));

/* impede que qualquer slide com muito texto transborde os 720px */
function ajustar(){
  slides.forEach(el => {
    const fit = el.querySelector('.fit');
    if (!fit) return;
    if (telaPequena()) { fit.style.transform = ''; fit.style.width = ''; return; }
    const oculto = !el.classList.contains('on');
    if (oculto) { el.style.visibility = 'hidden'; el.style.display = 'block'; }
    fit.style.transform = ''; fit.style.width = '';
    for (let n = 0; n < 2; n++) {
      const disp = fit.clientHeight, real = fit.scrollHeight;
      if (real <= disp + 1) break;
      const k = Math.max(.55, (disp / real) * 0.99);
      fit.style.transform = 'scale(' + k + ')';
      fit.style.width = (100 / k) + '%';
    }
    if (oculto) { el.style.visibility = ''; el.style.display = ''; }
  });
}

document.addEventListener('keydown', e => {
  const menuAberto = document.getElementById('menu').classList.contains('on');
  const objAberto = document.getElementById('obj').classList.contains('on');
  switch (e.key) {
    case 'ArrowRight': case 'PageDown': case ' ': e.preventDefault(); prox(); break;
    case 'ArrowLeft': case 'PageUp': ant(); break;
    case 'Home': ir(0); break;
    case 'End': ir(total - 1); break;
    case 'f': case 'F': tela(); break;
    case 'g': case 'G': painel('menu'); break;
    case 'o': case 'O': if (APRESENTADOR) painel('obj'); break;
    case 'Escape': if (menuAberto) painel('menu'); if (objAberto) painel('obj'); break;
  }
});

function tela(){
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen();
}
function painel(id){
  const outro = id === 'menu' ? 'obj' : 'menu';
  document.getElementById(outro).classList.remove('on');
  document.getElementById(id).classList.toggle('on');
}

document.getElementById('bNext').onclick = prox;
document.getElementById('bPrev').onclick = ant;
document.getElementById('bFull').onclick = tela;
document.getElementById('bMenu').onclick = () => painel('menu');
document.getElementById('bObj').onclick = () => painel('obj');
if (!APRESENTADOR) document.getElementById('bObj').remove();

/* zonas de clique */
const zonas = document.createElement('div');
zonas.className = 'zonas';
zonas.innerHTML = '<i class="l"></i><i class="r"></i>';
document.querySelector('.stage').appendChild(zonas);
zonas.querySelector('.l').onclick = ant;
zonas.querySelector('.r').onclick = prox;

/* swipe: so troca de slide quando o gesto e claramente horizontal,
   para nao atrapalhar a rolagem vertical do conteudo no celular */
let x0 = null, y0 = null;
addEventListener('touchstart', e => {
  x0 = e.touches[0].clientX;
  y0 = e.touches[0].clientY;
}, {passive:true});
addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  const dy = e.changedTouches[0].clientY - y0;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6) (dx < 0 ? prox : ant)();
  x0 = y0 = null;
}, {passive:true});

/* indice */
document.getElementById('menuGrade').innerHTML = SLIDES.map((s, i) => {
  const t = s.titulo || s.marca || (s.frase ? s.frase[0].replace(/<[^>]+>/g, '') : 'Slide');
  return '<div class="it" data-go="' + i + '"><div class="n">' + String(i + 1).padStart(2, '0') +
    ' · ' + (s.bloco || 'Capa') + '</div><div class="t">' + t + '</div></div>';
}).join('');
document.getElementById('menuGrade').onclick = e => {
  const it = e.target.closest('.it');
  if (!it) return;
  ir(+it.dataset.go);
  painel('menu');
};
document.getElementById('menu').onclick = e => { if (e.target.id === 'menu') painel('menu'); };

/* objecoes */
if (APRESENTADOR) {
  document.getElementById('obj').innerHTML =
    '<div class="cab"><h3>Respostas para as objeções</h3><span>Painel interno · tecla O para fechar</span></div>' +
    '<div class="grade">' + OBJECOES.map(o =>
      '<div class="c"><div class="q">' + o[0] + '</div><div class="a">' + o[1] + '</div></div>').join('') + '</div>';
  document.getElementById('obj').onclick = e => { if (e.target.id === 'obj') painel('obj'); };
}

/* link direto para um slide e botao voltar do navegador */
addEventListener('hashchange', () => {
  const n = (parseInt(location.hash.slice(1), 10) || 1) - 1;
  if (n !== atual) ir(n);
});

escala();
ir(location.hash ? (parseInt(location.hash.slice(1), 10) || 1) - 1 : 0);
ajustar();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajustar);
window.addEventListener('load', ajustar);
window.addEventListener('beforeprint', ajustar);
</script>
